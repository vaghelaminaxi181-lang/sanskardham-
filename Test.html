<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanskardham Staff Management</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #1e40af; --light: #f3f4f6; --red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 25px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid var(--blue); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { background: var(--blue); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.red { background: var(--red); }
        .admin-panel { display: none; background: #fff; padding: 20px; border-radius: 20px; border: 2px solid var(--blue); margin-top: 20px; }
        .tab-btn { display: inline-block; width: 48%; margin: 1%; background: #e5e7eb; color: #374151; }
        .active-tab { background: var(--blue); color: white; }
        .suggest-box { background: white; border: 1px solid #ddd; max-height: 150px; overflow-y: auto; position: absolute; width: 90%; z-index: 10; border-radius: 8px; }
        .suggest-box div { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        .report-table th, .report-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .missing { color: var(--red); font-weight: bold; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>SANSKARDHAM</h1>
    <p id="displayDate"></p>
    <button onclick="toggleAdmin()" style="width:auto; padding:5px 15px; background:rgba(255,255,255,0.2);">ADMIN LOGIN</button>
</div>

<div class="container">
    <div id="userSection" class="card">
        <input type="text" id="userSearch" placeholder="તમારું નામ શોધો..." onkeyup="searchDuty()">
        <div id="searchResult"></div>
    </div>

    <div id="adminArea" class="admin-panel">
        <input type="password" id="adminPass" placeholder="એડમિન પાસવર્ડ">
        <hr>
        <div>
            <button class="tab-btn active-tab" id="btn1" onclick="showTab('duty')">ડ્યુટી મેનેજ</button>
            <button class="tab-btn" id="btn2" onclick="showTab('staff')">સ્ટાફ એડિટ</button>
        </div>

        <div id="dutyTab">
            <button style="background:#10b981;" onclick="copyLastDay()">ગઈકાલની ડ્યુટી કોપી કરો 📋</button>
            <div style="position:relative;">
                <input type="text" id="stName" placeholder="સ્ટાફનું નામ..." onkeyup="getSuggest(this.value)">
                <div id="sugBox" class="suggest-box" style="display:none;"></div>
            </div>
            <select id="stDept">
                <option value="ER">ER</option><option value="WARD">WARD</option>
                <option value="GYNC">GYNC</option><option value="NICU">NICU</option>
                <option value="OPD">OPD</option><option value="OT">OT</option>
                <option value="OFF">OFF (રજા)</option>
            </select>
            <input type="text" id="stDuty" placeholder="ડ્યુટી ટાઈપ (M, N, D-M)">
            <button onclick="saveDuty()">સેવ ડ્યુટી ✅</button>
            <div class="missing">બાકી સ્ટાફ: <span id="missingNames">બધા સેટ છે</span></div>
        </div>

        <div id="staffTab" style="display:none;">
            <h4>નવો સ્ટાફ ઉમેરો / સુધારો</h4>
            <input type="text" id="newStaffName" placeholder="સ્ટાફનું પૂરું નામ">
            <button onclick="addStaff()">સ્ટાફ એડ કરો +</button>
            <div id="staffManageList" style="margin-top:15px; max-height:200px; overflow-y:auto;"></div>
        </div>

        <button style="margin-top:20px; background:#6b7280;" onclick="genReport()">માસિક રિપોર્ટ જુઓ 📊</button>
    </div>

    <div id="reportView" style="display:none;">
        <table class="report-table">
            <thead><tr><th>નામ</th><th>ડ્યુટી</th><th>OFF</th></tr></thead>
            <tbody id="reportTbody"></tbody>
        </table>
    </div>

    <div id="liveList" style="margin-top:20px;"></div>
</div>

<script>
    // --- FIREBASE CONFIG (તમારો ડેટા અહિયાં પેસ્ટ કરજો) ---
    const firebaseConfig = { databaseURL: "https://sanskardham-duty-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('displayDate').innerText = "તારીખ: " + today;

    let allStaff = [];

    // Load Staff from Firebase
    db.ref('staffList').on('value', (snap) => {
        allStaff = snap.val() ? Object.values(snap.val()) : [];
        renderStaffEditList(snap.val());
    });

    function addStaff() {
        let name = document.getElementById('newStaffName').value.trim();
        if(!name) return;
        db.ref('staffList').push(name);
        document.getElementById('newStaffName').value = '';
        alert('સ્ટાફ ઉમેરાઈ ગયો!');
    }

    function renderStaffEditList(data) {
        let div = document.getElementById('staffManageList');
        div.innerHTML = '';
        for(let id in data) {
            div.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #eee;">
                <span>${data[id]}</span>
                <button class="red" style="width:60px; padding:2px;" onclick="db.ref('staffList/${id}').remove()">X</button>
            </div>`;
        }
    }

    function getSuggest(val) {
        let box = document.getElementById('sugBox');
        box.innerHTML = '';
        if(!val) { box.style.display = 'none'; return; }
        let filtered = allStaff.filter(s => s.toLowerCase().includes(val.toLowerCase()));
        filtered.forEach(s => {
            let d = document.createElement('div');
            d.innerText = s;
            d.onclick = () => { document.getElementById('stName').value = s; box.style.display = 'none'; };
            box.appendChild(d);
        });
        box.style.display = 'block';
    }

    function saveDuty() {
        if(document.getElementById('adminPass').value !== '14052001') { alert('ખોટો પાસવર્ડ!'); return; }
        let name = document.getElementById('stName').value;
        let dept = document.getElementById('stDept').value;
        let duty = document.getElementById('stDuty').value;
        if(!name || !duty) return alert('વિગત અધૂરી છે!');
        db.ref('duty/' + today + '/' + name).set({ dept, duty });
        document.getElementById('stName').value = ''; document.getElementById('stDuty').value = '';
    }

    function copyLastDay() {
        let last = new Date(); last.setDate(last.getDate() - 1);
        let lastStr = last.toISOString().split('T')[0];
        db.ref('duty/' + lastStr).once('value', (s) => {
            if(s.exists()) { db.ref('duty/' + today).set(s.val()); alert('કોપી સફળ!'); }
        });
    }

    db.ref('duty/' + today).on('value', (snap) => {
        let data = snap.val() || {};
        let list = document.getElementById('liveList');
        let mis = document.getElementById('missingNames');
        list.innerHTML = '<h3>આજની ડ્યુટી લિસ્ટ</h3>';
        let done = Object.keys(data);
        let mNames = allStaff.filter(s => !done.includes(s));
        mis.innerText = mNames.length > 0 ? mNames.join(', ') : "બધા સેટ છે";
        for(let n in data) {
            list.innerHTML += `<div class="card"><strong>${n}</strong><br>વિભાગ: ${data[n].dept} | શિફ્ટ: ${data[n].duty}</div>`;
        }
    });

    function searchDuty() {
        let q = document.getElementById('userSearch').value.toLowerCase();
        let res = document.getElementById('searchResult');
        if(q.length < 2) return res.innerHTML = '';
        db.ref('duty/' + today).once('value', (snap) => {
            let data = snap.val() || {};
            let found = Object.keys(data).find(n => n.toLowerCase().includes(q));
            if(found) {
                res.innerHTML = `<div class="card" style="border-color:green"><strong>${found}</strong><br>ડ્યુટી: ${data[found].dept} - ${data[found].duty}</div>`;
            } else {
                res.innerHTML = `<div class="card" style="color:red; border-color:red;">તમારી ડ્યુટી મળી નથી. પ્રકાશ સર (+91 99839 43035) નો સંપર્ક કરો.</div>`;
            }
        });
    }

    function showTab(t) {
        document.getElementById('dutyTab').style.display = t === 'duty' ? 'block' : 'none';
        document.getElementById('staffTab').style.display = t === 'staff' ? 'block' : 'none';
        document.getElementById('btn1').className = t === 'duty' ? 'tab-btn active-tab' : 'tab-btn';
        document.getElementById('btn2').className = t === 'staff' ? 'tab-btn active-tab' : 'tab-btn';
    }

    function toggleAdmin() {
        let a = document.getElementById('adminArea');
        a.style.display = a.style.display === 'block' ? 'none' : 'block';
    }

    function genReport() {
        let month = today.substring(0, 7);
        db.ref('duty').once('value', (snap) => {
            let all = snap.val() || {};
            let rep = {};
            allStaff.forEach(s => rep[s] = {p:0, o:0});
            for(let d in all) {
                if(d.startsWith(month)) {
                    for(let n in all[d]) {
                        if(rep[n]) {
                            if(all[d][n].dept === 'OFF') rep[n].o++; else rep[n].p++;
                        }
                    }
                }
            }
            let h = "";
            for(let n in rep) h += `<tr><td>${n}</td><td style="color:green">${rep[n].p}</td><td style="color:red">${rep[n].o}</td></tr>`;
            document.getElementById('reportTbody').innerHTML = h;
            document.getElementById('reportView').style.display = 'block';
        });
    }
</script>
</body>
</html>
