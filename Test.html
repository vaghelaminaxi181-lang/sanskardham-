<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Duty Management</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { cursor: pointer; background-color: #28a745; color: white; font-weight: bold; border: none; }
        .admin-section { display: none; border-top: 2px solid #eee; margin-top: 20px; padding-top: 10px; }
        .staff-list { list-style: none; padding: 0; }
        .staff-item { display: flex; justify-content: space-between; background: #f9f9f9; padding: 5px 10px; margin-bottom: 5px; border-radius: 3px; }
        .delete-btn { background: #dc3545; width: auto; padding: 2px 8px; margin: 0; }
        datalist { width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>Duty Management</h2>
    
    <label>સ્ટાફનું નામ:</label>
    <input list="staffNames" id="staffInput" placeholder="નામ ટાઈપ કરો...">
    <datalist id="staffNames"></datalist>

    <label>ડ્યુટીની વિગત:</label>
    <input type="text" id="dutyTask" placeholder="ડ્યુટી લખો...">
    
    <button onclick="saveDuty()">ડ્યુટી સેવ કરો</button>
    <button style="background-color: #007bff;" onclick="copyYesterdayDuty()">ગઈકાલની ડ્યુટી કોપી કરો</button>

    <hr>

    <button style="background-color: #6c757d;" onclick="checkAdmin()">Admin Panel (Setting)</button>

    <div id="adminPanel" class="admin-section">
        <h3>Staff Management</h3>
        <input type="text" id="newStaffName" placeholder="નવું નામ ઉમેરો">
        <button onclick="addStaff()">Add Staff</button>
        
        <ul id="displayStaffList" class="staff-list"></ul>
    </div>
</div>

<script>
    // --- Initial Data Load ---
    let staffList = JSON.parse(localStorage.getItem('staffList')) || ["Suresh", "Ramesh"];
    let duties = JSON.parse(localStorage.getItem('duties')) || [];

    // --- Security: Admin Access ---
    function checkAdmin() {
        const pass = prompt("એડમિન પાસવર્ડ નાખો:");
        if (pass === "14052001") {
            document.getElementById('adminPanel').style.display = 'block';
            renderStaffList();
        } else {
            alert("ખોટો પાસવર્ડ!");
        }
    }

    // --- Staff Management (Add/Delete) ---
    function addStaff() {
        const name = document.getElementById('newStaffName').value.trim();
        if (name && !staffList.includes(name)) {
            staffList.push(name);
            saveAndRefresh();
            document.getElementById('newStaffName').value = "";
        }
    }

    function deleteStaff(index) {
        if(confirm("શું તમે આ નામ કાઢી નાખવા માંગો છો?")) {
            staffList.splice(index, 1);
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('staffList', JSON.stringify(staffList));
        renderStaffList();
        renderDataList();
    }

    // --- UI Rendering ---
    function renderStaffList() {
        const listEl = document.getElementById('displayStaffList');
        listEl.innerHTML = staffList.map((s, index) => `
            <li class="staff-item">
                ${s} <button class="delete-btn" onclick="deleteStaff(${index})">X</button>
            </li>
        `).join('');
    }

    function renderDataList() {
        const dataList = document.getElementById('staffNames');
        dataList.innerHTML = staffList.map(s => `<option value="${s}">`).join('');
    }

    // --- Duty Functions ---
    function saveDuty() {
        const name = document.getElementById('staffInput').value;
        const task = document.getElementById('dutyTask').value;
        const date = new Date().toLocaleDateString();

        if(name && task) {
            duties.push({ name, task, date });
            localStorage.setItem('duties', JSON.stringify(duties));
            alert("ડ્યુટી સેવ થઈ ગઈ!");
        }
    }

    // --- Copy Yesterday's Duty Logic ---
    function copyYesterdayDuty() {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toLocaleDateString();
        const todayStr = new Date().toLocaleDateString();

        const yesterdayDuties = duties.filter(d => d.date === yesterdayStr);

        if (yesterdayDuties.length > 0) {
            yesterdayDuties.forEach(d => {
                duties.push({ ...d, date: todayStr });
            });
            localStorage.setItem('duties', JSON.stringify(duties));
            alert("ગઈકાલની ડ્યુટી આજની તારીખમાં કોપી થઈ ગઈ!");
        } else {
            alert("ગઈકાલનો કોઈ ડેટા મળ્યો નથી.");
        }
    }

    // Initialize Suggestion List on Load
    renderDataList();

</script>

</body>
</html>
